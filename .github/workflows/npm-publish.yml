# This workflow will run tests using node and then publish a package to npm when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Node.js Package

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # npm install (not `npm ci`): this repo does not commit a package-lock.json.
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=2

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org/
      - run: npm install

      # Builds lib/module (bob) and lib/typescript (tsc) — the dirs the
      # published package ships from. lib/ is gitignored, so this must run.
      - run: npm run prepare

      # --ignore-scripts stops `prepare` running a second time during publish.
      - run: npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GRANULAR_NPM_PUBLISH_TOKEN_NEW }}
