trigger:
- feature/*

pr:
- feature/*

resources:
- repo: self

variables:
  vmImageName: 'ubuntu-latest'

stages:
- stage: SonarCloudAnalysis
  displayName: SonarCloud Analysis Stage
  jobs:
  - job: Analyze
    displayName: Run SonarCloud Analysis
    pool:
      vmImage: $(vmImageName)

    steps:
    - checkout: self
      fetchDepth: 0

    - task: NodeTool@0 #NOSONAR
      displayName: 'Use Node.js 24.13.0'
      inputs:
        versionSpec: '24.13.0'

    - script: |
        corepack enable
        YARN_ENABLE_SCRIPTS=false yarn install --immutable
      displayName: 'Install dependencies (Yarn 4)'

    - script: yarn test:coverage
      displayName: 'Run tests with coverage'

    - task: SonarCloudPrepare@3 # NOSONAR
      displayName: 'Prepare SonarCloud Analysis'
      inputs:
        SonarCloud: 'sdk_sonar'
        organization: 'fastpix'
        scannerMode: 'CLI'
        configMode: 'manual'
        cliProjectKey: 'FastPix_react-native-uploader'
        cliProjectName: 'react-native-uploader'
        extraProperties: |
          sonar.projectKey=FastPix_react-native-uploader
          sonar.organization=fastpix
          sonar.projectName=react-native-uploader
          sonar.sources=.
          sonar.sourceEncoding=UTF-8
          sonar.javascript.lcov.reportPaths=coverage/lcov.info
          sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/lib/**,**/*.html
          sonar.coverage.exclusions=**/__tests__/**,**/*.test.ts,example/**,**/*.config.js,**/*.config.mjs,babel.config.js

    - task: SonarCloudAnalyze@3   # NOSONAR
      displayName: 'Run SonarCloud Code Analysis'

    - task: SonarCloudPublish@3   # NOSONAR
      displayName: 'Publish SonarCloud Quality Gate Results'
      inputs:
        pollingTimeoutSec: '300'